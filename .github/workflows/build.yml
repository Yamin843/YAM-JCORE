name: Build libyamgg.so

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build shared library
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reassemble libyamjs.a
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/reassemble_lib.sh
          ./scripts/reassemble_lib.sh
          ls -lh app/src/main/jni/all_libs/LIBYAMJS/libyamjs.a

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
              "build-tools;34.0.0" \
              "platforms;android-34" \
              "ndk;25.2.9519653" \
              "cmake;3.22.1" \
              "platform-tools"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate JS headers
        shell: bash
        run: |
          python3 --version
          python3 scripts/build_bootstrap.py
          ls -l app/src/main/jni/Generated/*.h

      - name: Generate embedded_dex.h
        shell: bash
        continue-on-error: true
        run: |
          chmod +x ./scripts/build_dex.sh
          ./scripts/build_dex.sh
          ls -l app/src/main/jni/Generated/embedded_dex.h

      - name: Build shared library only
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:externalNativeBuildDebug \
              --stacktrace --no-daemon --console=plain

      - name: Locate libyamgg.so
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Searching for libyamgg.so ==="
          FOUND=$(find app/build -type f -name 'libyamgg.so' | head -1)
          if [ -z "$FOUND" ]; then
              echo "::error::libyamgg.so was not produced"
              find app/build -type f -name '*.so' -print
              exit 1
          fi
          echo "Found: $FOUND"
          ls -lh "$FOUND"
          echo "=== All .so files ==="
          find app/build -type f -name '*.so' -print

      - name: Upload libyamgg.so
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libyamgg.so
          path: |
            app/build/**/libyamgg.so
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
