name: Build libyamgg.so

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build shared library
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NDK_VERSION: '27.3.13750724'
      ABI: 'arm64-v8a'
      API: '24'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reassemble libyamjs.a
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/reassemble_lib.sh
          ./scripts/reassemble_lib.sh
          ls -lh app/src/main/jni/all_libs/LIBYAMJS/libyamjs.a

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Clean stale SDK/NDK caches
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "Cleaning SDK root: $SDK_ROOT"
          # احذف أي مجلد NDK جزئي أو تالف
          rm -rf "$SDK_ROOT/ndk" || true
          # احذف ملفات التنزيل المؤقتة
          rm -rf "$SDK_ROOT/.temp" || true
          rm -rf "$SDK_ROOT/.downloadIntermediates" || true
          echo "Clean done."

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
              "build-tools;34.0.0" \
              "platforms;android-34" \
              "ndk;${NDK_VERSION}" \
              "cmake;3.22.1" \
              "platform-tools"
          sdkmanager --list_installed

      - name: Generate JS headers
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/build_bootstrap.py
          ls -l app/src/main/jni/Generated/*.h

      - name: Generate embedded_dex.h
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/build_dex.sh
          ./scripts/build_dex.sh
          ls -l app/src/main/jni/Generated/embedded_dex.h

      - name: Locate NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
              echo "::error::Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set"
              exit 1
          fi
          NDK_DIR="$SDK_ROOT/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_DIR" ]; then
              echo "::error::NDK not found at $NDK_DIR"
              ls -la "$SDK_ROOT/ndk/" 2>/dev/null || true
              exit 1
          fi
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
          echo "✓ NDK: $NDK_DIR"

      - name: Locate CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          CMAKE_CANDIDATE="$SDK_ROOT/cmake/3.22.1/bin/cmake"
          if [ -x "$CMAKE_CANDIDATE" ]; then
              CMAKE_USE="$CMAKE_CANDIDATE"
          else
              CMAKE_USE="$(command -v cmake || true)"
          fi
          if [ -z "${CMAKE_USE:-}" ] || [ ! -x "$CMAKE_USE" ]; then
              echo "::error::No usable cmake binary found"
              echo "  candidate: $CMAKE_CANDIDATE"
              exit 1
          fi
          echo "CMAKE_BIN=$CMAKE_USE" >> "$GITHUB_ENV"
          "$CMAKE_USE" --version

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          "$CMAKE_BIN" \
              -S app/src/main/jni \
              -B build/so \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM="android-$API" \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              -DANDROID_NDK="$NDK_DIR"

      - name: Build libyamgg.so
        shell: bash
        run: |
          set -euo pipefail
          "$CMAKE_BIN" --build build/so --target yamgg -j"$(nproc)"

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          echo "=== .so files produced ==="
          find build/so -type f -name '*.so' -print

          SO="$(find build/so -type f -name 'libyamgg.so' | head -1)"
          if [ -z "$SO" ]; then
              echo "::error::libyamgg.so was not produced"
              exit 1
          fi
          echo "SO_PATH=$SO" >> "$GITHUB_ENV"
          ls -lh "$SO"
          file "$SO"
          echo ""
          echo "=== JNI exports ==="
          nm -D "$SO" | grep -E 'JNI_OnLoad|JNI_OnUnload' || {
              echo "::error::JNI_OnLoad not exported"
              exit 1
          }
          echo ""
          echo "=== NEEDED libraries ==="
          readelf -d "$SO" | grep NEEDED || true

      - name: Upload libyamgg.so
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libyamgg-so
          path: ${{ env.SO_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/so/CMakeFiles/CMakeOutput.log
            build/so/CMakeFiles/CMakeError.log
            build/so/.ninja_log
          if-no-files-found: ignore
          retention-days: 7
