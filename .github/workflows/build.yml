name: Build shared library (.so)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build libyamgg.so
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reassemble libyamjs.a from parts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/reassemble_lib.sh
          ./scripts/reassemble_lib.sh
          ls -lh app/src/main/jni/all_libs/LIBYAMJS/libyamjs.a

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
              "build-tools;34.0.0" \
              "platforms;android-34" \
              "ndk;25.2.9519653" \
              "cmake;3.22.1" \
              "platform-tools"
          sdkmanager --list_installed

      - name: Set up Gradle (system install, no wrapper jar)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-read-only: false

      - name: Generate JS headers
        shell: bash
        run: |
          python3 --version
          python3 scripts/build_bootstrap.py
          ls -l app/src/main/jni/Generated/*.h

      - name: Generate embedded_dex.h
        shell: bash
        continue-on-error: true
        run: |
          chmod +x ./scripts/build_dex.sh
          ./scripts/build_dex.sh
          ls -l app/src/main/jni/Generated/embedded_dex.h

      - name: Build only the shared library
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:externalNativeBuildDebug --stacktrace --no-daemon --console=plain

      - name: Locate libyamgg.so
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for libyamgg.so..."
          find app/build -type f -name 'libyamgg.so' -print
          echo ""
          echo "All native libraries built:"
          find app/build -type f -name '*.so' -print

      - name: Upload .so artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yamgg-shared-library
          path: |
            app/build/intermediates/cmake/debug/obj/arm64-v8a/libyamgg.so
            app/build/intermediates/merged_native_libs/debug/out/lib/arm64-v8a/libyamgg.so
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
