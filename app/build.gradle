// app/build.gradle — minimal configuration for building libyamgg.so.
//
// The project produces a single shared library (libyamgg.so). It does
// not need an APK, and it does not declare targets in defaultConfig
// because the CMakeLists.txt already defines exactly one target named
// "yamgg". Calling `gradle :app:externalNativeBuildDebug` builds that
// target without invoking the APK packaging pipeline.

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yamgg.modview'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yamgg.modview'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            java.srcDirs     = ['src/main/java']
            res.srcDirs      = ['src/main/res']
            manifest.srcFile = 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
    // No external dependencies.
}
